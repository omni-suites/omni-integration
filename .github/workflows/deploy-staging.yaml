name: Deploy Omni Integration

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE="${{ secrets.GCP_AR_REPO }}/omni-integration:staging"
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, staging]
    environment: staging
    steps:
      - name: Pull and Restart Container
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_AR_REPO: ${{ secrets.GCP_AR_REPO }}
        run: |
          cd /opt/omni-infra/apps
          
          # Authenticate root docker with GCP Artifact Registry using Service Account Key
          echo "$GCP_SA_KEY" | sudo docker login -u _json_key --password-stdin https://us-central1-docker.pkg.dev
          
          sudo docker compose -f docker-compose.yml pull omni-integration
          sudo docker compose -f docker-compose.yml up -d --no-deps omni-integration
          sudo docker image prune -f -a
